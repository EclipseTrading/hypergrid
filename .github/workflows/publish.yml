name: Publish

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1.4.4
        with:
          node-version: 14
      - run: npm install
      - run: npm run build:gulp
      - run: npm run build
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@eclipsetrading'
          package-manager-cache: false
      - run: npm --no-git-tag-version version ${{ github.event.release.name }}
      - run: npm publish
